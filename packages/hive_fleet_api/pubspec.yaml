name: hive_fleet_api
description: A Flutter package implementing FleetApi using local storage (Hive) with polling for real-time updates.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  fleet_api:
    path: ../fleet_api
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  meta: ^1.19.0
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.16.1
  hive_ce_generator: ^1.11.3
  mocktail: ^1.0.5
  test: any
  very_good_analysis: ^11.0.0
